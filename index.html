<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Prof. Nélio Lima - Lab. de Eletromagnetismo</title>
    <link rel="icon" href="icone.png" type="image/png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h2 { color: #333; }
        .controles {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
        input[type="number"] {
            padding: 8px;
            font-size: 16px;
            width: 100px;
            text-align: center;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #003d82; }
        canvas {
            border: 2px solid #ccc;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h2>Levitação Magnética - Atividade Prática</h2>
    <p>Prof. Nélio Néves Lima | Física III - IFG</p>

    <div class="controles">
        <p>Calcule a Resistência (R) necessária no eletroímã para que a Força Magnética anule o Peso da barra.</p>
        <label>Resistência R (Ohms): </label>
        <input type="number" id="input_R" step="0.1" placeholder="Ex: 15.5">
        <button onclick="testarValores()">Aplicar Resistência</button>
    </div>
    <br>
    
    <main></main>
    <script src="sketch.js"></script>

</body>
</html>
